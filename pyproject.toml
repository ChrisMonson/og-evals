[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "og-evals"
version = "0.1.0"
description = "Scenarios, harnesses and scorers for how models behave in a text-adventure world."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "inspect_ai>=0.3.264",
    "mcp>=2.2",
    "uvicorn",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.optional-dependencies]
anthropic = ["anthropic"]
openai = ["openai"]

[tool.setuptools]
packages = ["evals", "scenarios"]

[tool.setuptools.package-data]
scenarios = ["*.yaml"]
